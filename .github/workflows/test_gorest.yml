

name: Tests GoRest

on:
  push:
    branches: [main]
    paths:
      - 'tests/02-Automatizados/API-GoRest/**'
      - '.github/workflows/test-gorest.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/02-Automatizados/API-GoRest/**'
      - '.github/workflows/test-gorest.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/02-Automatizados/API-GoRest
    env:
      GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Comprobar que el token llega
        run: 'echo "Longitud del token: ${#GOREST_TOKEN}"'
      - run: pytest -v