

name: Tests ReqRes

on:
  push:
    branches: [main]
    paths:
      - 'tests/02-Automatizados/API-ReqRes/**'
      - '.github/workflows/test-reqres.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/02-Automatizados/API-ReqRes/**'
      - '.github/workflows/test-reqres.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/02-Automatizados/API-ReqRes
    env:
      REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Comprobar que el token llega
        run: 'echo "Longitud del token: ${#REQRES_API_KEY}"'
      - run: pytest -v