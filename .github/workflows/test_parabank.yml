

name: Tests ParaBank

# ParaBank es un servidor de demos ajeno, detrás de Cloudflare con límite de peticiones (error 1015).
# Por eso este workflow NO se dispara en cada push: se lanza a mano desde la pestaña Actions.
on:
  workflow_dispatch:

# Evita dos ejecuciones a la vez contra ParaBank (duplicaría el tráfico).
concurrency:
  group: parabank
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: tests/02-Automatizados/ParaBank

    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar navegadores de Playwright
        run: playwright install --with-deps chromium

      - name: Ejecutar tests
        run: pytest -v